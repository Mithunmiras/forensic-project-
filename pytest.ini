[pytest]
pythonpath = .
testpaths = tests
markers =
    integration: needs a real PostgreSQL (embedded pgserver, or RETAILIQ_TEST_DATABASE_URL)
    embedder: needs the local ONNX embedding model (downloaded on first use)
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore:.*unsupported syntax.*
